name: CI

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reporank
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install

      - name: pnpm audit
        run: pnpm audit --audit-level=high

      - name: Build
        run: npx turbo run build --cache-dir=.turbo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}

      - name: Run deterministic benchmarks
        run: npx tsx comprehensive-benchmark.mjs 2>&1 | tail -20

      - name: Test grading engine
        run: npx turbo run test --filter=@reporank/grading-engine --cache-dir=.turbo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Pipeline security tests
        run: npx vitest run tests/pipeline-security/

      - name: Push database schema
        run: pnpm --filter @reporank/api db:push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reporank
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: packages/
          fail_ci_if_error: false
