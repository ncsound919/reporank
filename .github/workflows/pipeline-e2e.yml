name: Pipeline E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pnpm install
      - run: pip install dagster dagster-webserver
      - run: pnpm turbo run orchestrator:run
      - run: pnpm --filter @reporank/cli run reporank analyze fixtures/sample-ts-project
      - run: pnpm --filter @reporank/cli run reporank analyze fixtures/sample-python-project
