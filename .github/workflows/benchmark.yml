name: Benchmark

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "packages/**/*.ts"
      - "apps/cli/src/**/*.ts"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "package.json"

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/**/package.json
            packages/**/package.json
            services/**/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Comprehensive deterministic benchmark
        run: pnpm exec tsx comprehensive-benchmark.mjs

      - name: Upload comprehensive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comprehensive
          path: benchmark-results-comprehensive.json
          if-no-files-found: error

      - name: Code review accuracy (heuristic)
        run: >
          pnpm exec tsx apps/cli/src/index.ts harness
          --dataset apps/cli/src/__tests__/fixtures/code-review-dataset.json
          --heuristic-only
          --output benchmark-results-harness.json

      - name: Upload harness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-harness
          path: benchmark-results-harness.json
          if-no-files-found: error

      - name: Code review accuracy (LLM)
        if: ${{ secrets.VIBESERVE_URL != '' && secrets.VIBESERVE_API_KEY != '' }}
        run: >
          pnpm exec tsx apps/cli/src/index.ts harness
          --dataset apps/cli/src/__tests__/fixtures/code-review-dataset.json
          --llm-only
          --output benchmark-results-harness-llm.json
        env:
          VIBESERVE_URL: ${{ secrets.VIBESERVE_URL }}
          VIBESERVE_API_KEY: ${{ secrets.VIBESERVE_API_KEY }}

      - name: Upload LLM harness results
        if: always() && hashFiles('benchmark-results-harness-llm.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-harness-llm
          path: benchmark-results-harness-llm.json
          if-no-files-found: error
