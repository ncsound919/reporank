name: reporank verify

permissions:
  contents: read
  actions: read
  pull-requests: write

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: reporank-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VIBESERVE_URL: ${{ secrets.VIBESERVE_URL }}
      VIBESERVE_API_KEY: ${{ secrets.VIBESERVE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/**/package.json
            packages/**/package.json
            services/**/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        run: pnpm build

      - name: Run verify on PR diff
        id: verify
        run: |
          set +e
          pnpm exec reporank verify . \
            --diff \
            --gh-markdown \
            --threshold 70 \
            --detect-hallucinations \
            > verify-output.md
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload verify output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporank-verify-output
          path: verify-output.md
          if-no-files-found: error

      - name: Echo verify output
        if: always()
        run: cat verify-output.md

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- reporank-verify -->';
            const body = `${marker}\n` + fs.readFileSync('verify-output.md', 'utf8');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(c =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail on threshold violation
        if: steps.verify.outputs.exit_code != '0'
        run: |
          echo "::error::reporank verify failed"
          exit 1
